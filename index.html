<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>微博发博进度管理器</title>
  <style>
    :root {
      --bg1: #f5f7fc;
      --bg2: #eef1f8;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #8b91a3;
      --border: #edeff4;
      --brand1: #ff9a5a;
      --brand2: #ff5e3a;
      --primary1: #7b8bff;
      --primary2: #5566f0;
      --success: #1fb574;
      --danger: #ff5a5f;
      --track: #eef0f5;
      --shadow: 0 10px 30px rgba(31, 41, 55, 0.06);
      --shadow-soft: 0 4px 14px rgba(31, 41, 55, 0.05);
      --radius: 18px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(1200px 480px at 100% -10%, rgba(255, 138, 61, 0.10), transparent 60%),
        radial-gradient(900px 420px at -10% 0%, rgba(85, 102, 240, 0.08), transparent 55%),
        linear-gradient(170deg, var(--bg1), var(--bg2));
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 14px 40px; }

    /* ---------- Header ---------- */
    .app-header {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 14px; margin: 0 -14px 14px;
      background: rgba(245, 247, 252, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(237, 239, 244, 0.9);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--brand1), var(--brand2));
      color: #fff; font-weight: 800; font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 16px rgba(255, 94, 58, 0.30);
    }
    .brand h1 { font-size: 1.1rem; margin: 0; font-weight: 800; letter-spacing: 0.2px; }
    .brand-sub { font-size: 0.72rem; color: var(--muted); margin: 1px 0 0; }

    /* ---------- Buttons ---------- */
    button {
      border: none; border-radius: 11px; padding: 9px 14px;
      font-size: 0.88rem; font-weight: 600; cursor: pointer;
      color: var(--text); background: #f1f3f9;
      box-shadow: var(--shadow-soft); touch-action: manipulation;
      transition: transform 0.12s ease, box-shadow 0.18s ease, filter 0.18s ease, background 0.18s ease;
      font-family: inherit;
    }
    button:hover { filter: brightness(0.98); }
    button:active { transform: translateY(1px) scale(0.985); }
    button.accent { background: linear-gradient(135deg, var(--brand1), var(--brand2)); color: #fff; box-shadow: 0 8px 18px rgba(255, 94, 58, 0.28); }
    button.ghost { background: #fff; color: var(--primary2); border: 1.5px solid #dfe3ff; box-shadow: none; }
    button.danger { background: var(--danger); color: #fff; box-shadow: 0 8px 18px rgba(255, 90, 95, 0.25); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .mode-toggle { border-radius: 999px; padding: 8px 16px; }

    /* ---------- Inputs ---------- */
    input[type="date"], input[type="number"], input[type="text"], input[type="url"], input[type="file"] {
      border: 1.5px solid var(--border); border-radius: 11px;
      padding: 9px 12px; font-size: 0.9rem; background: #fff; color: var(--text);
      font-family: inherit; transition: border-color 0.18s, box-shadow 0.18s;
      outline: none;
    }
    input:focus { border-color: var(--primary1); box-shadow: 0 0 0 3px rgba(123, 139, 255, 0.18); }

    /* ---------- Top bar ---------- */
    .top-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .date-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .date-bar input[type="date"] { padding: 8px 10px; }

    /* ---------- Summary ---------- */
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 12px 10px; text-align: center; box-shadow: var(--shadow);
    }
    .card .num { font-size: 1.5rem; font-weight: 800; line-height: 1.15; letter-spacing: 0.3px; }
    .card .label { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }

    /* ---------- Action strips ---------- */
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
    .actions .label-tag { font-size: 0.82rem; color: var(--muted); align-self: center; margin-right: 2px; }

    /* ---------- Sync panel ---------- */
    .sync-panel {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 14px; margin-bottom: 14px; box-shadow: var(--shadow);
    }
    .sync-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .sync-row:last-child { margin-bottom: 0; }
    .sync-row strong { font-size: 0.92rem; }
    .sync-check { font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .sync-panel input[type="url"] { flex: 1; min-width: 200px; }
    .sync-header { justify-content: space-between; }
    .sync-body { display: none; padding-top: 10px; margin-top: 10px; border-top: 1px dashed var(--border); }
    .sync-body.expanded { display: block; animation: fadeIn 0.2s ease; }
    #syncStatusCompact { font-size: 0.74rem; }

    /* ---------- Account cards ---------- */
    .account-row {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 13px; box-shadow: var(--shadow);
      animation: fadeUp 0.35s ease both;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .account-row:active { transform: scale(0.997); }
    .row-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
    .name-input {
      flex: 1; min-width: 80px; max-width: 200px;
      font-weight: 800; font-size: 1.1rem; padding: 6px 2px;
      border: none; border-bottom: 2px solid transparent; border-radius: 0; background: transparent;
    }
    .name-input:focus { border-bottom-color: var(--primary1); box-shadow: none; }
    .target-chip {
      display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; color: var(--muted);
      background: #f6f7fb; border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px;
      flex-shrink: 0;
    }
    .target-chip input { width: 44px; text-align: center; border: none; background: transparent; padding: 2px; font-weight: 700; color: var(--text); }
    .target-chip input:focus { box-shadow: none; }

    /* number cells */
    .cell-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
      gap: 7px;
      margin-bottom: 12px;
    }
    .cell {
      display: flex; align-items: center; justify-content: center;
      aspect-ratio: 1;
      border-radius: 10px;
      background: #fff;
      border: 1.5px solid var(--border);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer; user-select: none;
      box-shadow: var(--shadow-soft);
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.08s ease;
    }
    .cell:hover {
      border-color: var(--primary2);
      box-shadow: 0 4px 10px rgba(33, 150, 243, 0.14);
    }
    .cell:active { transform: scale(0.92); }
    .cell.done {
      background: linear-gradient(135deg, var(--brand1), var(--brand2));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 5px 14px rgba(255, 94, 58, 0.28);
    }
    .cell.next {
      border-color: var(--primary1);
      box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.15), var(--shadow-soft);
    }
    .progress-pct {
      font-size: 1.2rem; font-weight: 800; color: var(--text);
      min-width: 52px; text-align: right; line-height: 1;
    }

    .row-foot {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .ctrl-group {
      display: inline-flex; align-items: center; border-radius: 999px;
      background: #f1f3f9; padding: 3px; gap: 2px; box-shadow: var(--shadow-soft);
    }
    .ctrl-group button {
      border-radius: 999px; box-shadow: none; background: transparent; color: var(--text);
      min-width: 32px; height: 32px; padding: 0; font-size: 1.1rem; font-weight: 700; line-height: 1;
    }
    .ctrl-group button:active { background: #e6e9f2; transform: scale(0.92); }
    .ctrl-group .count {
      display: inline-flex; align-items: center; justify-content: center; min-width: 40px;
      font-weight: 700; font-size: 0.95rem; color: var(--muted);
    }

    .remain { font-weight: 800; font-size: 1.05rem; color: var(--danger); white-space: nowrap; }
    .remain.ok { color: var(--success); }
    .rate { color: var(--muted); font-size: 0.78rem; font-weight: 600; margin-left: auto; }

    .row-actions { display: flex; gap: 8px; margin-top: 0; flex-wrap: wrap; }
    .row-actions button { font-size: 0.82rem; padding: 8px 14px; }

    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 10px; line-height: 1.6; }
    .empty { text-align: center; padding: 40px 16px; color: var(--muted); background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius); }

    /* ---------- Mode switching ---------- */
    body.simple-mode .full-only { display: none !important; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 520px) {
      .summary { grid-template-columns: repeat(3, 1fr); }
      .brand h1 { font-size: 1rem; }
      .cell { height: 26px; border-radius: 10px; }
      .progress-pct { font-size: 1.05rem; min-width: 46px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">微</div>
        <div>
          <h1>微博发博进度管理器</h1>
          <p class="brand-sub">多账号每日发博进度看板</p>
        </div>
      </div>
      <button type="button" id="modeToggle" class="mode-toggle accent" onclick="toggleMode()">精简版</button>
    </header>

    <div class="top-bar full-only">
      <div class="date-bar">
        <button type="button" onclick="changeDate(-1)">← 前一天</button>
        <input type="date" id="datePicker" onchange="setDate(this.value)" />
        <button type="button" onclick="changeDate(1)">后一天 →</button>
        <button type="button" class="ghost" onclick="setDate(todayStr())">今天</button>
      </div>
      <div class="date-bar">
        <button type="button" class="accent" onclick="addAccount()">+ 添加账号</button>
        <button type="button" onclick="exportData()">导出备份</button>
        <label>
          <input type="file" id="importFile" accept=".json" onchange="importData(this)" style="display:none" />
          <button type="button" class="ghost" onclick="document.getElementById('importFile').click()">导入备份</button>
        </label>
      </div>
    </div>

    <div class="summary full-only" id="summary"></div>

    <div class="actions full-only">
      <button type="button" class="ghost" onclick="allPlus(1)">全部 +1</button>
      <button type="button" class="ghost" onclick="allPlus(-1)">全部 -1</button>
      <button type="button" class="danger" onclick="resetToday()">重置今天</button>
      <button type="button" class="danger" onclick="clearAllTargets()">清空目标</button>
      <button type="button" class="ghost" id="restoreBackupBtn" onclick="restoreFromBackup()" style="display:none">恢复备份</button>
    </div>

    <div class="actions">
      <span class="label-tag">排序</span>
      <button type="button" id="sortName" class="accent" onclick="setSort('name')">按名称</button>
      <button type="button" id="sortDone" class="ghost" onclick="setSort('done')">按完成任务</button>
      <label class="sync-check"><input type="checkbox" id="hideDone" onchange="toggleHideDone(this.checked)" /> 仅看未完成</label>
    </div>

    <div class="sync-panel full-only">
      <div class="sync-row sync-header">
        <strong>云同步（手机 / 电脑一致，无需令牌）</strong>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="hint" id="syncStatusCompact" style="margin-top:0"></span>
          <button type="button" id="syncToggle" class="ghost" onclick="toggleSyncPanel()">展开</button>
        </div>
      </div>
      <div id="syncBody" class="sync-body">
        <div class="sync-row">
          <label class="sync-check"><input type="checkbox" id="autoSync" onchange="toggleAutoSync(this.checked)" /> 自动同步</label>
        </div>
        <div class="sync-row">
          <input type="url" id="endpointInput" placeholder="同步地址（cloudflared 公网地址）" />
          <button onclick="saveEndpoint()">保存地址</button>
          <button class="accent" onclick="pullCloud(false)">拉取</button>
          <button class="accent" onclick="pushCloudManual()">上传</button>
        </div>
        <div class="hint" id="syncStatus">未设置同步地址。</div>
      </div>
    </div>

    <div id="accounts"></div>
    <div id="empty" class="empty" style="display:none">还没有账号，点击右上角“添加账号”开始。</div>

    <div class="hint full-only">
      操作说明：每个账号下方的橙色进度格代表已完成，灰色代表未完成；点击任意一格可直接把完成数设到该位置，加减按钮用于快速调整。<br />
      云同步：数据通过本机 cloudflared 隧道共享，手机和电脑打开本页即自动同步，无需输入任何令牌。若同步地址失效（重启隧道会变），在上方重新填写新地址即可。<br />
      数据同时自动保存在浏览器本地，导出备份可防止丢失。
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'weibo_post_tracker_v1';
    const BACKUP_KEY = 'weibo_post_tracker_backup_v1';
    const ENDPOINT_KEY = 'weibo_tracker_endpoint';
    const DEFAULT_ENDPOINT = 'https://charitable-configurations-dominant-pmid.trycloudflare.com';

    const defaultAccounts = [
      { id: 'a1', name: '甜崽', target: 6, completed: {} },
      { id: 'a2', name: '悦色', target: 13, completed: {} },
      { id: 'a3', name: '苏城', target: 4, completed: {} },
      { id: 'a4', name: 'star', target: 6, completed: {} },
      { id: 'a5', name: 'codehive', target: 4, completed: {} },
      { id: 'a6', name: '酸酸', target: 4, completed: {} }
    ];

    let state = loadState();

    function fmtLocalDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function todayStr() {
      return fmtLocalDate(new Date());
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.accounts && Array.isArray(parsed.accounts)) {
            return {
              date: parsed.date || todayStr(),
              accounts: parsed.accounts,
              sortMode: parsed.sortMode === 'done' ? 'done' : 'name',
              hideDone: !!parsed.hideDone
            };
          }
        }
      } catch (e) { console.error(e); }
      return { date: todayStr(), accounts: defaultAccounts.map(a => ({ ...a, completed: {} })), sortMode: 'name', hideDone: false };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
      schedulePush();
    }

    function saveLocalOnly() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getCompleted(account, date) {
      return Number(account.completed[date]) || 0;
    }

    function setCompleted(account, date, n) {
      const target = Number(account.target) || 0;
      account.completed[date] = Math.max(0, Math.min(n, target));
      saveState();
    }

    function setDate(date) {
      state.date = date;
      document.getElementById('datePicker').value = date;
      saveState();
    }

    function changeDate(delta) {
      const parts = state.date.split('-').map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2] + delta);
      setDate(fmtLocalDate(d));
    }

    function addAccount(name, target) {
      state.accounts.push({
        id: 'a' + Date.now() + Math.random().toString(36).slice(2, 6),
        name: name || '新账号',
        target: Number(target) || 4,
        completed: {}
      });
      saveState();
    }

    function removeAccount(id) {
      if (!confirm('确定删除这个账号吗？')) return;
      state.accounts = state.accounts.filter(a => a.id !== id);
      saveState();
    }

    function updateAccount(id, field, value) {
      const acc = state.accounts.find(a => a.id === id);
      if (!acc) return;
      if (field === 'name') acc.name = value;
      if (field === 'target') {
        acc.target = Math.max(0, Number(value) || 0);
        const cur = getCompleted(acc, state.date);
        if (cur > acc.target) acc.completed[state.date] = acc.target;
      }
      saveState();
    }

    function allPlus(delta) {
      state.accounts.forEach(acc => {
        setCompleted(acc, state.date, getCompleted(acc, state.date) + delta);
      });
    }

    function resetToday() {
      if (!confirm('确定重置今天的所有完成数吗？')) return;
      state.accounts.forEach(acc => {
        acc.completed[state.date] = 0;
      });
      saveState();
    }

    function clearAllTargets() {
      if (!confirm('确定清空所有账号的目标条数吗？\n（会先自动备份当前数据，可一键恢复）')) return;
      localStorage.setItem(BACKUP_KEY, JSON.stringify(state));
      state.accounts.forEach(acc => {
        acc.target = 0;
      });
      saveState();
      updateRestoreBtn();
    }

    function restoreFromBackup() {
      const raw = localStorage.getItem(BACKUP_KEY);
      if (!raw) return;
      if (!confirm('确定恢复到上次「清空目标」前的数据吗？')) return;
      try {
        state = JSON.parse(raw);
        saveState();
        updateRestoreBtn();
      } catch (e) {
        alert('备份数据损坏，无法恢复');
      }
    }

    function updateRestoreBtn() {
      const btn = document.getElementById('restoreBackupBtn');
      if (!btn) return;
      btn.style.display = localStorage.getItem(BACKUP_KEY) ? '' : 'none';
    }

    function setSort(mode) {
      state.sortMode = mode === 'done' ? 'done' : 'name';
      saveState();
    }

    function toggleHideDone(c) {
      state.hideDone = !!c;
      saveState();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '微博发博进度备份_' + state.date + '.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed.accounts && Array.isArray(parsed.accounts)) {
            state = { date: parsed.date || state.date, accounts: parsed.accounts };
            saveState();
            alert('导入成功');
          } else {
            alert('备份文件格式不正确');
          }
        } catch (e) {
          alert('解析失败：' + e.message);
        }
        input.value = '';
      };
      reader.readAsText(file);
    }

    function renderSummary() {
      let totalTarget = 0;
      let totalDone = 0;
      let finished = 0;
      state.accounts.forEach(acc => {
        const t = Number(acc.target) || 0;
        const d = getCompleted(acc, state.date);
        totalTarget += t;
        totalDone += d;
        if (t > 0 && d >= t) finished += 1;
      });
      const totalRemain = Math.max(0, totalTarget - totalDone);
      const rate = totalTarget > 0 ? Math.round((totalDone / totalTarget) * 100) + '%' : '—';

      document.getElementById('summary').innerHTML = [
        ['总目标', totalTarget],
        ['已完成', totalDone],
        ['还差', totalRemain],
        ['完成率', rate],
        ['已达标', finished + '/' + state.accounts.length],
        ['未达标', Math.max(0, state.accounts.length - finished) + '/' + state.accounts.length]
      ].map(([label, num]) => `<div class="card"><div class="num">${num}</div><div class="label">${label}</div></div>`).join('');
    }

    function render() {
      document.getElementById('datePicker').value = state.date;
      renderSummary();
      document.getElementById('sortName').className = state.sortMode === 'name' ? 'accent' : 'ghost';
      document.getElementById('sortDone').className = state.sortMode === 'done' ? 'accent' : 'ghost';
      document.getElementById('hideDone').checked = state.hideDone;

      const container = document.getElementById('accounts');
      if (state.accounts.length === 0) {
        container.innerHTML = '';
        document.getElementById('empty').style.display = '';
        return;
      }
      document.getElementById('empty').style.display = 'none';

      let list = state.accounts.slice();
      if (state.hideDone) {
        list = list.filter(a => getCompleted(a, state.date) < (Number(a.target) || 0));
      }
      list.sort((a, b) => {
        const ta = Number(a.target) || 0, tb = Number(b.target) || 0;
        const da = getCompleted(a, state.date), db = getCompleted(b, state.date);
        const aDone = ta > 0 && da >= ta, bDone = tb > 0 && db >= tb;
        if (aDone !== bDone) return aDone ? 1 : -1;
        if (state.sortMode === 'name') return a.name.localeCompare(b.name, 'zh-Hans-CN');
        return db - da;
      });

      if (list.length === 0) {
        container.innerHTML = '<div class="empty">当前筛选下没有账号（都已完成）</div>';
        return;
      }

      container.innerHTML = list.map(acc => {
        const target = Number(acc.target) || 0;
        const done = getCompleted(acc, state.date);
        const remain = Math.max(0, target - done);
        const rate = target > 0 ? Math.round((done / target) * 100) : 0;
        const cells = [];
        for (let i = 1; i <= target; i++) {
          const cls = i <= done ? 'done' : (i === done + 1 ? 'next' : '');
          cells.push(`<div class="cell ${cls}" onclick="setCompletedByCell('${acc.id}', ${i})">${i}</div>`);
        }
        return `
          <div class="account-row">
            <div class="row-head">
              <input type="text" class="name-input" value="${escapeHtml(acc.name)}"
                onchange="updateAccount('${acc.id}', 'name', this.value)" />
              <span class="target-chip">目标 <input type="number" min="0" value="${target}"
                onchange="updateAccount('${acc.id}', 'target', this.value)" /></span>
            </div>
            <div class="cell-grid">${cells.join('')}</div>
            <div class="row-foot">
              <span class="remain ${remain === 0 ? 'ok' : ''}">
                ${remain === 0 ? '已完成' : '还差 ' + remain + ' 条'}
              </span>
              <div class="ctrl-group">
                <button onclick="adjust('${acc.id}', -1)">−</button>
                <span class="count">${done}</span>
                <button onclick="adjust('${acc.id}', 1)">+</button>
              </div>
              <span class="rate">${done}/${target}</span>
            </div>
            <div class="row-actions">
              <button class="accent" onclick="adjust('${acc.id}', 1)">+1</button>
              <button class="ghost" onclick="setCompletedByCell('${acc.id}', ${target})">完成全部</button>
              <button class="ghost" onclick="setCompletedByCell('${acc.id}', 0)">清零</button>
              <button class="danger" onclick="removeAccount('${acc.id}')">删除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function adjust(id, delta) {
      const acc = state.accounts.find(a => a.id === id);
      if (!acc) return;
      setCompleted(acc, state.date, getCompleted(acc, state.date) + delta);
    }

    function setCompletedByCell(id, n) {
      const acc = state.accounts.find(a => a.id === id);
      if (!acc) return;
      setCompleted(acc, state.date, n);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    /* ---------- 云同步（cloudflared 隧道，无需令牌） ---------- */
    function getEndpoint() {
      return localStorage.getItem(ENDPOINT_KEY) || DEFAULT_ENDPOINT;
    }
    function autoSyncEnabled() {
      return localStorage.getItem('weibo_tracker_autosync') !== '0';
    }
    function setSyncStatus(msg, isErr) {
      const el = document.getElementById('syncStatus');
      el.textContent = msg;
      el.style.color = isErr ? 'var(--danger)' : 'var(--muted)';
      const compact = document.getElementById('syncStatusCompact');
      if (compact) {
        compact.textContent = msg;
        compact.style.color = isErr ? 'var(--danger)' : 'var(--muted)';
      }
    }

    const SYNC_COLLAPSED_KEY = 'weibo_tracker_sync_collapsed';
    function isSyncCollapsed() {
      const v = localStorage.getItem(SYNC_COLLAPSED_KEY);
      return v === null ? true : v === '1';
    }
    function toggleSyncPanel() {
      localStorage.setItem(SYNC_COLLAPSED_KEY, isSyncCollapsed() ? '0' : '1');
      applySyncCollapsed();
    }
    function applySyncCollapsed() {
      const collapsed = isSyncCollapsed();
      const body = document.getElementById('syncBody');
      if (body) body.classList.toggle('expanded', !collapsed);
      const btn = document.getElementById('syncToggle');
      if (btn) btn.textContent = collapsed ? '展开' : '收起';
    }
    function saveEndpoint() {
      const v = document.getElementById('endpointInput').value.trim().replace(/\/+$/, '');
      if (!v) { alert('请输入同步地址'); return; }
      localStorage.setItem(ENDPOINT_KEY, v);
      setSyncStatus('地址已保存，正在拉取...');
      pullCloud(true);
    }
    function toggleAutoSync(c) {
      localStorage.setItem('weibo_tracker_autosync', c ? '1' : '0');
      setSyncStatus(c ? '已开启自动同步' : '已关闭自动同步');
    }
    let pushTimer = null;
    function schedulePush() {
      if (!autoSyncEnabled()) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(() => {
        pushCloud().catch(e => setSyncStatus('自动同步失败: ' + e.message, true));
      }, 800);
    }
    async function pushCloud() {
      const ep = getEndpoint();
      setSyncStatus('上传中...');
      const res = await fetch(ep + '/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      setSyncStatus('已同步 ' + new Date().toLocaleTimeString());
    }
    async function pushCloudManual() {
      try { await pushCloud(); }
      catch (e) { setSyncStatus('上传失败: ' + e.message, true); }
    }
    async function pullCloud(silent) {
      const ep = getEndpoint();
      if (!silent) setSyncStatus('拉取中...');
      try {
        const res = await fetch(ep + '/state');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json();
        if (d && Array.isArray(d.accounts)) {
          state = d;
          if (!state.date) state.date = todayStr();
          saveLocalOnly();
          render();
          setSyncStatus('已拉取 ' + new Date().toLocaleTimeString());
        } else if (!silent) {
          setSyncStatus('云端还没有数据', true);
        }
      } catch (e) {
        if (!silent) setSyncStatus('拉取失败: ' + e.message, true);
      }
    }

    const UI_MODE_KEY = 'weibo_tracker_ui_mode';
    function isSimpleMode() { return localStorage.getItem(UI_MODE_KEY) === 'simple'; }
    function applyMode() {
      const simple = isSimpleMode();
      document.body.classList.toggle('simple-mode', simple);
      const btn = document.getElementById('modeToggle');
      if (btn) btn.textContent = simple ? '完整版' : '精简版';
    }
    function toggleMode() {
      localStorage.setItem(UI_MODE_KEY, isSimpleMode() ? 'full' : 'simple');
      applyMode();
    }

    /* ---------- 初始化 ---------- */
    (function init() {
      applyMode();
      applySyncCollapsed();
      document.getElementById('autoSync').checked = autoSyncEnabled();
      document.getElementById('endpointInput').value = getEndpoint();
      render();
      updateRestoreBtn();
      pullCloud(true);
    })();
  </script>
</body>
</html>
