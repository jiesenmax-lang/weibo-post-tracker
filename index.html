<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>微博发博进度管理器</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #333333;
      --muted: #777777;
      --primary: #2196f3;
      --accent: #ff9800;
      --success: #4caf50;
      --danger: #f44336;
      --gray: #e0e0e0;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .date-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="date"], input[type="number"], input[type="text"], input[type="file"] {
      border: 1px solid #cccccc;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.95rem;
      background: #fff;
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      color: #fff;
      background: var(--primary);
      box-shadow: var(--shadow);
      touch-action: manipulation;
    }
    button:active { opacity: 0.85; }
    button.accent { background: var(--accent); }
    button.danger { background: var(--danger); }
    button.ghost {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .card {
      background: var(--card);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .card .num {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .card .label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .summary .card:nth-child(3) {
      background: #fff4e5;
      border: 2px solid #ffb74d;
    }
    .summary .card:nth-child(3) .num { color: #e65100; }
    .summary .card:nth-child(4) .num { color: var(--primary); }
    .account-row {
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--primary);
    }
    .account-row.complete {
      border-left-color: var(--success);
    }
    .account-row.incomplete {
      border-left-color: var(--accent);
    }
    .remain {
      background: #fff1f0;
      border-radius: 999px;
      padding: 5px 9px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--danger);
      white-space: nowrap;
    }
    .remain.ok {
      background: #edf8ee;
      color: var(--success);
    }
    .progress-line {
      height: 6px;
      background: #edf0f3;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-line > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: inherit;
      transition: width 0.15s ease;
    }
    .row-head {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .name-input {
      width: 90px;
      font-weight: 700;
    }
    .target-input { width: 60px; text-align: center; }
    .meta {
      display: flex;
      gap: 10px;
      align-items: center;
      flex: 1;
      flex-wrap: wrap;
    }
    .rate { color: var(--muted); font-size: 0.85rem; }
    .ctrl-group {
      display: inline-flex;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .ctrl-group button {
      border-radius: 0;
      box-shadow: none;
      min-width: 34px;
      padding: 6px 8px;
      font-size: 1rem;
    }
    .ctrl-group .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      background: #fff;
      color: var(--text);
      font-weight: 700;
      border-top: 1px solid var(--primary);
      border-bottom: 1px solid var(--primary);
      font-size: 1rem;
    }
    .cell-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
      gap: 5px;
      margin-top: 10px;
    }
    .cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      background: var(--gray);
      color: #555;
      font-size: 0.75rem;
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
      transition: transform 0.05s;
    }
    .cell:active { transform: scale(0.92); }
    .cell.done {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border-color: #e65100;
    }
    .cell.next {
      border-color: var(--primary);
      box-shadow: inset 0 0 0 2px var(--primary);
    }
    .row-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .row-actions button {
      font-size: 0.8rem;
      padding: 6px 10px;
    }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.4;
    }
    .empty {
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }
    @media (max-width: 480px) {
      .summary { grid-template-columns: repeat(2, 1fr); }
      h1 { font-size: 1.1rem; }
      .cell-grid { grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); }
    }
  </style>
</head>
<body>
  <h1>微博发博进度管理器</h1>
  <div class="top-bar">
    <div class="date-bar">
      <button type="button" onclick="changeDate(-1)">← 前一天</button>
      <input type="date" id="datePicker" onchange="setDate(this.value)" />
      <button type="button" onclick="changeDate(1)">后一天 →</button>
      <button type="button" class="ghost" onclick="setDate(todayStr())">今天</button>
    </div>
    <div class="date-bar">
      <button type="button" class="accent" onclick="addAccount()">+ 添加账号</button>
      <button type="button" onclick="exportData()">导出备份</button>
      <label>
        <input type="file" id="importFile" accept=".json" onchange="importData(this)" style="display:none" />
        <button type="button" class="ghost" onclick="document.getElementById('importFile').click()">导入备份</button>
      </label>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="actions">
    <button type="button" class="ghost" onclick="allPlus(1)">全部 +1</button>
    <button type="button" class="ghost" onclick="allPlus(-1)">全部 -1</button>
    <button type="button" class="danger" onclick="resetToday()">重置今天</button>
  </div>

  <div id="accounts"></div>
  <div id="empty" class="empty" style="display:none">还没有账号，点击右上角“添加账号”开始。</div>

  <div class="hint">
    操作说明：每个账号右侧的橙色格子代表已完成，灰色格子代表未完成；点击任意格子可直接把完成数设到该位置。加减按钮用于快速调整。数据自动保存在浏览器本地，导出备份可防止丢失。
  </div>

  <script>
    const STORAGE_KEY = 'weibo_post_tracker_v1';

    const initialDate = '2026-08-23';
    const defaultAccounts = [
      { id: 'a1', name: '甜崽', target: 6, completed: { [initialDate]: 3 } },
      { id: 'a2', name: '悦色', target: 13, completed: { [initialDate]: 1 } },
      { id: 'a3', name: '苏城', target: 4, completed: { [initialDate]: 1 } },
      { id: 'a4', name: 'star', target: 6, completed: { [initialDate]: 1 } },
      { id: 'a5', name: 'codehive', target: 4, completed: { [initialDate]: 1 } },
      { id: 'a6', name: '酸酸', target: 4, completed: { [initialDate]: 0 } }
    ];

    let state = loadState();

    function todayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.accounts && Array.isArray(parsed.accounts)) {
            return {
              date: parsed.date || todayStr(),
              accounts: parsed.accounts
            };
          }
        }
      } catch (e) { console.error(e); }
      return { date: initialDate, accounts: defaultAccounts.map(a => ({ ...a, completed: { ...a.completed } })) };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    }

    function getCompleted(account, date) {
      return Number(account.completed[date]) || 0;
    }

    function setCompleted(account, date, n) {
      const target = Number(account.target) || 0;
      account.completed[date] = Math.max(0, Math.min(n, target));
      saveState();
    }

    function setDate(date) {
      state.date = date;
      document.getElementById('datePicker').value = date;
      saveState();
    }

    function changeDate(delta) {
      const d = new Date(state.date + 'T00:00:00');
      d.setDate(d.getDate() + delta);
      setDate(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
    }

    function addAccount(name, target) {
      state.accounts.push({
        id: 'a' + Date.now() + Math.random().toString(36).slice(2, 6),
        name: name || '新账号',
        target: Number(target) || 4,
        completed: {}
      });
      saveState();
    }

    function removeAccount(id) {
      if (!confirm('确定删除这个账号吗？')) return;
      state.accounts = state.accounts.filter(a => a.id !== id);
      saveState();
    }

    function updateAccount(id, field, value) {
      const acc = state.accounts.find(a => a.id === id);
      if (!acc) return;
      if (field === 'name') acc.name = value;
      if (field === 'target') {
        acc.target = Math.max(0, Number(value) || 0);
        const cur = getCompleted(acc, state.date);
        if (cur > acc.target) acc.completed[state.date] = acc.target;
      }
      saveState();
    }

    function allPlus(delta) {
      state.accounts.forEach(acc => {
        setCompleted(acc, state.date, getCompleted(acc, state.date) + delta);
      });
    }

    function resetToday() {
      if (!confirm('确定重置今天的所有完成数吗？')) return;
      state.accounts.forEach(acc => {
        acc.completed[state.date] = 0;
      });
      saveState();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '微博发博进度备份_' + state.date + '.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed.accounts && Array.isArray(parsed.accounts)) {
            state = { date: parsed.date || state.date, accounts: parsed.accounts };
            saveState();
            alert('导入成功');
          } else {
            alert('备份文件格式不正确');
          }
        } catch (e) {
          alert('解析失败：' + e.message);
        }
        input.value = '';
      };
      reader.readAsText(file);
    }

    function renderSummary() {
      let totalTarget = 0;
      let totalDone = 0;
      let finished = 0;
      state.accounts.forEach(acc => {
        const t = Number(acc.target) || 0;
        const d = getCompleted(acc, state.date);
        totalTarget += t;
        totalDone += d;
        if (t > 0 && d >= t) finished += 1;
      });
      const totalRemain = Math.max(0, totalTarget - totalDone);
      const rate = totalTarget > 0 ? Math.round((totalDone / totalTarget) * 100) + '%' : '—';

      document.getElementById('summary').innerHTML = [
        ['总目标', totalTarget],
        ['已完成', totalDone],
        ['还差', totalRemain],
        ['完成率', rate],
        ['已达标', finished + '/' + state.accounts.length],
        ['未达标', Math.max(0, state.accounts.length - finished) + '/' + state.accounts.length]
      ].map(([label, num]) => `<div class="card"><div class="num">${num}</div><div class="label">${label}</div></div>`).join('');
    }

    function render() {
      document.getElementById('datePicker').value = state.date;
      renderSummary();
      const container = document.getElementById('accounts');
      if (state.accounts.length === 0) {
        container.innerHTML = '';
        document.getElementById('empty').style.display = '';
        return;
      }
      document.getElementById('empty').style.display = 'none';

      container.innerHTML = state.accounts.map(acc => {
        const target = Number(acc.target) || 0;
        const done = getCompleted(acc, state.date);
        const remain = Math.max(0, target - done);
        const rate = target > 0 ? Math.round((done / target) * 100) : 0;
        const cells = [];
        for (let i = 1; i <= target; i++) {
          const cls = i <= done ? 'done' : (i === done + 1 ? 'next' : '');
          cells.push(`<div class="cell ${cls}" onclick="setCompletedByCell('${acc.id}', ${i})">${i}</div>`);
        }
        return `
          <div class="account-row">
            <div class="row-head">
              <input type="text" class="name-input" value="${escapeHtml(acc.name)}"
                onchange="updateAccount('${acc.id}', 'name', this.value)" />
              <div class="meta">
                <span>目标</span>
                <input type="number" class="target-input" min="0" value="${target}"
                  onchange="updateAccount('${acc.id}', 'target', this.value)" />
                <div class="ctrl-group">
                  <button onclick="adjust('${acc.id}', -1)">−</button>
                  <span class="count">${done}</span>
                  <button onclick="adjust('${acc.id}', 1)">+</button>
                </div>
                <span class="remain ${remain === 0 ? 'ok' : ''}">
                  ${remain === 0 ? '已完成' : '还差 ' + remain + ' 条'}
                </span>
                <span class="rate">${rate}%</span>
              </div>
            </div>
            <div class="cell-grid">${cells.join('')}</div>
            <div class="row-actions">
              <button class="accent" onclick="adjust('${acc.id}', 1)">+1</button>
              <button class="ghost" onclick="setCompletedByCell('${acc.id}', ${target})">完成全部</button>
              <button class="ghost" onclick="setCompletedByCell('${acc.id}', 0)">清零</button>
              <button class="danger" onclick="removeAccount('${acc.id}')">删除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function adjust(id, delta) {
      const acc = state.accounts.find(a => a.id === id);
      if (!acc) return;
      setCompleted(acc, state.date, getCompleted(acc, state.date) + delta);
    }

    function setCompletedByCell(id, n) {
      const acc = state.accounts.find(a => a.id === id);
      if (!acc) return;
      setCompleted(acc, state.date, n);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    render();
  </script>
</body>
</html>
